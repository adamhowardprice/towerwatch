name: Smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    # The server needs a native x86-64 host. Mono aborts under Rosetta.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Download the dedicated server
        run: make fetch-full

      - name: Boot the server with the mod
        run: make smoke

      - name: Build the package
        if: success() || failure()
        run: make package

      # Upload only logs and the mod package. Never upload .valheim-server, which has game files.
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs
          path: smoke-logs/
          if-no-files-found: warn

      - name: Upload package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TowerArchers-package
          path: dist/*.zip
          if-no-files-found: error
