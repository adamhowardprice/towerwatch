[config]
schemaVersion = "0.0.1"

[package]
# Replace the namespace with your Thunderstore team name before you publish.
namespace = "AdamPrice"
name = "TowerArchers"
versionNumber = "0.1.0"
description = "Friendly stationary archers that defend your base from a Watch Post."
websiteUrl = ""
containsNsfwContent = false

[package.dependencies]
denikson-BepInExPack_Valheim = "5.4.2360"
ValheimModding-Jotunn = "2.30.2"

[build]
icon = "./icon.png"
readme = "../README.md"
outdir = "../dist"

[[build.copy]]
source = "../src/TowerArchers/bin/Release/TowerArchers.dll"
target = "plugins/TowerArchers/TowerArchers.dll"

[publish]
repository = "https://thunderstore.io"
communities = ["valheim"]

[publish.categories]
valheim = ["mods"]
